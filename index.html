<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Age of Empires II HD</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #ddd;
      }
      #dropzone {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .emscripten_border {
        line-height: 0;
      }
      canvas.emscripten {
        border: 0px none;
        background-color: #000;
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }
      /* Pure Minimal Loader - hidden when running */
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ffd700;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #status {
        font-size: 14px;
        color: #eee;
        letter-spacing: 0.5px;
      }
      .progress-box {
        width: 320px;
        height: 10px;
        background: #222;
        border: 1px solid #444;
        border-radius: 5px;
        overflow: hidden;
      }
      progress#progress {
        width: 100%;
        height: 100%;
        display: block;
        appearance: none;
        -webkit-appearance: none;
        border: none;
      }
      progress#progress::-webkit-progress-bar {
        background: #222;
      }
      progress#progress::-webkit-progress-value {
        background: #ffd700;
      }
      progress#progress::-moz-progress-bar {
        background: #ffd700;
      }
      #startbtn {
        margin-top: 8px;
        padding: 8px 24px;
        background: #ffd700;
        color: #000;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Real Game Canvas Viewport -->
    <div id="dropzone">
      <div class="emscripten_border">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
    </div>

    <!-- Minimal Engine Loader -->
    <div id="loading">
      <figure id="spinner">
        <div class="spinner"></div>
      </figure>
      <div id="status">Starting Age of Empires II HD...</div>
      <div class="progress-box">
        <progress value="0" max="100" id="progress"></progress>
      </div>
      <button id="startbtn" onclick="start()">Start</button>

      <!-- Hidden Boxedwine controls -->
      <span id="sound-checkbox" style="display: none"><input type="checkbox" id="soundToggle" checked /></span>
      <input type="checkbox" id="pointerLock" checked style="display: none">
      <input type="checkbox" id="showConsole" style="display: none">
      <input type="checkbox" id="resize" checked style="display: none">
      <button id="uploadbtn" style="display: none"></button>
      <input style="display: none" id="upload" type="file" multiple />
      <button id="downloadbtn" style="display: none"></button>
      <a style="display: none" id="modalLink" href="#openModal"></a>
      <a style="display: none" id="modalLinkExe" href="#openModalExe"></a>
    </div>

    <textarea class="emscripten" id="output" rows="6" style="display: none"></textarea>

    <!-- Modals -->
    <div id="openModal" style="display:none;"></div>
    <div id="openModalExe" style="display:none;"></div>

    <script src="boxedwine-shell.js?v=2.1"></script>
    <script async type="text/javascript" src="boxedwine.js?v=2.1"></script>
  </body>
</html>
